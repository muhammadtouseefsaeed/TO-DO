<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Up To Date - Touseef Malik</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img src="https://i.postimg.cc/Sn43yJmx/Touseef.jpg" alt="Touseef Malik" class="profile-pic" />
    <h1>Up To Date - Task Manager</h1>
    <p class="author">Created by <strong>Touseef Malik</strong></p>
  </header>

  <main>
    <div class="task-input">
      <input type="text" id="taskInput" placeholder="Enter new task..." />
      <button id="addBtn">Add Task</button>
    </div>

    <section class="task-lists">
      <div class="list">
        <h2>🕒 Remaining Tasks</h2>
        <ul id="remainingTasks"></ul>
      </div>

      <div class="list">
        <h2>✅ Completed Tasks</h2>
        <ul id="completedTasks"></ul>
      </div>
    </section>
  </main>

  <footer>
    <p>Reserved Copy Rights © Touseef Malik</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
